[project]
name = "rowproof"
version = "0.1.5"
description = "Prove a database migration or replication didn't lose, add or change a single row."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13",
    "psycopg[binary]>=3.1",
    "clickhouse-connect>=0.7",
]

[project.urls]
Homepage = "https://github.com/ajinkyajain23/rowproof"
Documentation = "https://github.com/ajinkyajain23/rowproof/blob/main/docs/USAGE.md"
Source = "https://github.com/ajinkyajain23/rowproof"
Issues = "https://github.com/ajinkyajain23/rowproof/issues"

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.6"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "testcontainers>=4.0",
]

[project.scripts]
rowproof = "rowproof.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rowproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a real running Postgres (or other engine) instance",
]

[tool.ruff]
line-length = 100
